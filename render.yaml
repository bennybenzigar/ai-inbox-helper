services:
  # 1. Backend Web Service
  - type: web
    name: ai-inbox-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-inbox-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: "https://ai-inbox-frontend.onrender.com"
      - key: GOOGLE_CALLBACK_URL
        value: "https://ai-inbox-backend.onrender.com/auth/google/callback"
      - key: AI_PROVIDER
        value: mock

  # 2. Frontend Static Site
  - type: web
    name: ai-inbox-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist/ai-inbox-helper/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# 3. Managed PostgreSQL Database
databases:
  - name: ai-inbox-db
    databaseName: ai_inbox_helper
    user: ai_inbox_user
    plan: free
