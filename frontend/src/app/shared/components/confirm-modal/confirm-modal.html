@if (isOpen) {
  <div class="modal-backdrop" (click)="onBackdropClick($event)" role="dialog" aria-modal="true">
    <div class="modal-panel">
      <div class="modal-header">
        <div class="icon-bubble" [class.danger]="isDanger">
          {{ isDanger ? '!' : '?' }}
        </div>
        <div class="header-text">
          <h3>{{ title }}</h3>
        </div>
      </div>

      <div class="modal-body">
        <p>{{ message }}</p>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn-cancel"
          [disabled]="busy"
          (click)="onCancel()">
          {{ cancelText }}
        </button>
        <button
          type="button"
          class="btn-confirm"
          [class.danger]="isDanger"
          [disabled]="busy"
          (click)="onConfirm()">
          {{ busy ? 'Processing...' : confirmText }}
        </button>
      </div>
    </div>
  </div>
}
